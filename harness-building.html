<!doctype html>
<html lang="en" data-lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>harness · every building in the city scene</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap"
    />
    <link rel="stylesheet" href="css/site.css?v=12" />
    <style>
      /* A development tool, not a page of the site. It mounts the real
         js/scene-city.js, so whatever it shows is what ships. */
      body {
        display: grid;
        grid-template-columns: 290px 1fr;
        height: 100vh;
        height: 100svh;
        overflow: hidden;
      }

      aside {
        border-right: 1px solid var(--rule);
        overflow-y: auto;
        padding: 14px 0 40px;
        font: 400 13px/1.6 var(--font);
      }

      h1 {
        margin: 0 16px 4px;
        font: 500 13px/1.6 var(--font);
        color: var(--fg);
      }

      .hint {
        margin: 0 16px 14px;
        color: var(--faint);
        font-size: 12px;
      }

      .grp {
        margin: 14px 16px 5px;
        color: var(--faint);
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      button.pick {
        display: block;
        width: 100%;
        padding: 5px 16px;
        text-align: left;
        color: var(--dim);
        font: inherit;
      }

      button.pick:hover {
        color: var(--fg);
        background: var(--bg-2);
      }

      button.pick[aria-pressed="true"] {
        color: var(--fg);
        background: var(--bg-2);
        box-shadow: inset 2px 0 0 var(--claude);
      }

      .count {
        color: var(--faint);
      }

      main {
        position: relative;
        overflow: hidden;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
        cursor: grab;
      }

      canvas:active {
        cursor: grabbing;
      }

      .bar2 {
        position: absolute;
        top: 12px;
        right: 14px;
        display: flex;
        gap: 4px;
        font: 400 12px/1.6 var(--font);
      }

      .bar2 button {
        padding: 2px 9px;
        color: var(--dim);
        border: 1px solid transparent;
        border-radius: 3px;
      }

      .bar2 button[aria-pressed="true"] {
        color: var(--fg);
        border-color: var(--rule);
        background: var(--bg-2);
      }

      .read {
        position: absolute;
        left: 16px;
        bottom: 14px;
        color: var(--faint);
        font: 400 11px/1.6 var(--font);
      }

      .now {
        position: absolute;
        left: 16px;
        top: 14px;
        color: var(--fg);
        font: 500 14px/1.6 var(--font);
      }
    </style>
  </head>
  <body>
    <aside>
      <h1>city scene · every piece</h1>
      <p class="hint">
        drag to turn · wheel to zoom · double-click to reset<br />
        mounts the real <code>js/scene-city.js</code>
      </p>
      <nav id="list"></nav>
    </aside>

    <main>
      <canvas id="view"></canvas>
      <div class="now" id="now"></div>
      <div class="bar2">
        <button type="button" data-theme-set="dark">dark</button>
        <button type="button" data-theme-set="light">light</button>
        <button type="button" data-theme-set="redis">redis</button>
      </div>
      <div class="read" id="read"></div>
    </main>

    <script type="module">
      import city from './js/scene-city.js?v=2'

      const root = document.documentElement
      const TOKENS = ['bg', 'bg-2', 'fg', 'dim', 'faint', 'rule', 'claude', 'ok']
      const readTokens = () => {
        const s = getComputedStyle(root)
        const o = {}
        for (const t of TOKENS) o[t] = s.getPropertyValue(`--${t}`).trim()
        return o
      }

      const THREE = await import('https://unpkg.com/three@0.186.0/build/three.module.js')
      const canvas = document.getElementById('view')
      const host = canvas.parentElement

      const scene = city({
        THREE,
        canvas,
        width: host.clientWidth,
        height: host.clientHeight,
        tokens: readTokens(),
        still: false,
      })

      // The scene writes to `world` every frame for its own pan, so the harness never
      // touches it. Two groups go in above it instead: `offset` slides the piece being
      // looked at onto the origin, `pivot` turns and scales about that origin.
      const world = scene.world
      const parent = world.parent
      const pivot = new THREE.Group()
      const offset = new THREE.Group()
      parent.add(pivot)
      pivot.add(offset)
      offset.add(world)

      const ISQ2 = Math.SQRT1_2
      const at = (u, v) => [(u + v) * ISQ2, (v - u) * ISQ2]

      // One entry per distinct name; the carpet types appear on many plots, so keep a
      // handful of each and let the count say how common it is.
      const byName = new Map()
      for (const c of scene.catalog) {
        if (!byName.has(c.name)) byName.set(c.name, { name: c.name, at: [], n: 0 })
        const e = byName.get(c.name)
        e.n++
        if (e.at.length < 8) e.at.push(c)
      }
      const entries = [...byName.values()]
      const landmarks = entries.filter((e) => e.n <= 2)
      const fabric = entries.filter((e) => e.n > 2)

      const list = document.getElementById('list')
      const now = document.getElementById('now')
      const read = document.getElementById('read')
      let active = null
      let idx = 0

      const frame = (e, step = 0) => {
        if (active === e) idx = (idx + step + e.at.length) % e.at.length
        else {
          active = e
          idx = 0
        }
        const c = e.at[idx]
        const [x, z] = at(c.u, c.v)
        offset.position.set(-x, -c.h * 0.42, -z)
        pivot.rotation.y = 0
        pivot.scale.setScalar(Math.max(1.1, 3.4 / Math.max(0.9, c.h)))
        now.textContent = e.name + (e.at.length > 1 ? `  ${idx + 1}/${e.at.length}` : '')
        for (const b of list.querySelectorAll('button'))
          b.setAttribute('aria-pressed', String(b.dataset.name === e.name))
      }

      const section = (label, items) => {
        const h = document.createElement('p')
        h.className = 'grp'
        h.textContent = label
        list.append(h)
        for (const e of items) {
          const b = document.createElement('button')
          b.type = 'button'
          b.className = 'pick'
          b.dataset.name = e.name
          b.innerHTML = e.name + (e.n > 1 ? ` <span class="count">×${e.n}</span>` : '')
          b.addEventListener('click', () => frame(e, 1))
          list.append(b)
        }
      }
      section('landmarks', landmarks)
      section('city fabric', fabric)

      let drag = null
      canvas.addEventListener('pointerdown', (ev) => {
        drag = { x: ev.clientX, y: ev.clientY, r: pivot.rotation.y }
        canvas.setPointerCapture(ev.pointerId)
      })
      canvas.addEventListener('pointermove', (ev) => {
        if (!drag) return
        pivot.rotation.y = drag.r + (ev.clientX - drag.x) * 0.008
      })
      canvas.addEventListener('pointerup', () => (drag = null))
      canvas.addEventListener('wheel', (ev) => {
        ev.preventDefault()
        pivot.scale.multiplyScalar(ev.deltaY > 0 ? 0.92 : 1.087)
      })
      canvas.addEventListener('dblclick', () => active && frame(active))

      for (const b of document.querySelectorAll('[data-theme-set]'))
        b.addEventListener('click', () => {
          root.dataset.theme = b.dataset.themeSet
          scene.retint(readTokens())
          for (const o of document.querySelectorAll('[data-theme-set]'))
            o.setAttribute('aria-pressed', String(o === b))
        })

      new ResizeObserver(() => scene.resize(host.clientWidth, host.clientHeight)).observe(host)

      let last = performance.now()
      let acc = 0
      let n = 0
      // A message has no fixed place to stand and look at, so while that entry is
      // selected the harness keeps asking the scene for another one.
      let pokeIn = 0
      const tick = (t) => {
        const dt = Math.min((t - last) / 1000, 0.1)
        last = t
        acc += dt
        if (active && active.name.includes('말풍선')) {
          pokeIn -= dt
          if (pokeIn <= 0) {
            pokeIn = 1.3
            scene.poke?.()
          }
        }
        if (++n % 30 === 0) {
          read.textContent = `${Math.round(30 / acc)} fps · ${entries.length} kinds · ${scene.catalog.length} pieces`
          acc = 0
        }
        scene.render(t / 1000, dt)
        requestAnimationFrame(tick)
      }
      requestAnimationFrame(tick)

      frame(landmarks[0] ?? entries[0])
    </script>
  </body>
</html>
