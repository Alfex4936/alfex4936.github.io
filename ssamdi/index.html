<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>쌈디의 날들</title>
  <meta name="description" content="2010년 7월 5일에 태어난 말티즈 쌈디의 사진과 영상을 찍은 날짜 순서대로 모아 둔 곳입니다.">
  <meta name="theme-color" content="#fbfdff">
  <meta name="color-scheme" content="only light">
  <meta property="og:title" content="쌈디의 날들">
  <meta property="og:description" content="말티즈 쌈디의 사진과 영상을 찍은 날짜 순서대로 모아 둔 곳입니다.">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="alternate icon" href="./favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <script>if ('WebGL2RenderingContext' in window) document.documentElement.classList.add('gl');</script>
  <script type="module" crossorigin src="./assets/main-BPwstMfC.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/main-BS8ewyW4.css">
</head>
<body>
  <canvas class="stage" id="stage" aria-hidden="true"></canvas>
  <a class="skip" href="#archive">사진첩으로 건너뛰기</a>

  <header class="masthead" id="top" tabindex="-1">
    <a class="masthead__home" href="#top" aria-label="쌈디의 날들 처음으로">
      <img src="./favicon.svg" width="38" height="38" alt="">
    </a>
    <nav aria-label="페이지 메뉴">
      <a href="#archive">사진첩</a>
      <a href="#longevity">십장생</a>
    </nav>
  </header>

  <section class="hero" aria-labelledby="hero-title">
    <div class="sky" aria-hidden="true">
      <div class="cloud" style="--w:220px;--t:95s;--d:-20s;top:15%;--x:8%"><svg viewBox="0 0 140 70"><path fill="currentColor" d="M22 62a18 18 0 0 1 4-35 26 26 0 0 1 48-10 22 22 0 0 1 38 12 17 17 0 0 1 6 33z"/></svg></div>
      <div class="cloud" style="--w:140px;--t:120s;--d:-75s;top:34%;--x:72%"><svg viewBox="0 0 140 70"><path fill="currentColor" d="M22 62a18 18 0 0 1 4-35 26 26 0 0 1 48-10 22 22 0 0 1 38 12 17 17 0 0 1 6 33z"/></svg></div>
    </div>
    <div class="meadow" aria-hidden="true">
      <svg viewBox="0 0 1440 190" preserveAspectRatio="none">
        <path class="hills__wide" fill="#cdeeb5" d="M0 92C180 40 360 34 560 70s380 52 560 12 260-30 320-20V190H0z"/>
        <path class="hills__narrow" fill="#cdeeb5" d="M0 49C300 18 570 16 850 35s440 23 590 2V190H0z"/>
      </svg>
    </div>
    <svg class="hills hills--front" viewBox="0 0 1440 190" preserveAspectRatio="none" aria-hidden="true">
      <path fill="#b3e397" d="M0 136c220-58 420-62 640-26s420 44 800-30V190H0z"/>
    </svg>
    <div class="hero__intro">
      <h1 class="hero__name" id="hero-title">쌈디의 <span>날들</span></h1>
      <p class="hero__facts">2010년 7월 5일생 <span>말티즈 2kg</span></p>
    </div>
    <div class="hero__face" role="img" aria-label="쌈디 얼굴 사진">
      <img class="hero__still" src="./hero/ssamdi-800.webp" alt="" width="800" height="681" fetchpriority="high" draggable="false">
    </div>
    <button type="button" class="tilt-tip" data-tilt-tip hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="3.5" width="10" height="17" rx="2.4" transform="rotate(-14 12 12)"/><path d="M3.5 9.5c-1 1.8-1 3.7 0 5.5M20.5 9c1 1.8 1 3.7 0 5.5"/></svg>
      핸드폰을 기울여 보세요!
    </button>
    <div class="hero__story">
      <p class="hero__days" data-life hidden>
        오늘은 태어난 지 <strong class="hero__count"><span data-days></span>일째</strong>
      </p>
      <p class="hero__meta"><span data-age></span> <span data-birthday></span></p>
      <div class="hero__actions">
        <a class="cta hero__open" href="#archive">사진첩 펼치기<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v13M6.5 12.5L12 18l5.5-5.5"/></svg></a>
        <button type="button" class="cta cta--soft" data-upload hidden><span>사진 보내기</span><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V6M6.5 11.5L12 6l5.5 5.5"/></svg></button>
      </div>
    </div>
  </section>

  <main class="archive" id="archive" aria-labelledby="archive-title" tabindex="-1">
    <div class="archive__head">
      <div>
        <h2 class="archive__title" id="archive-title">사진첩</h2>
        <p class="archive__summary" data-summary></p>
        <p class="archive__legend" data-legend hidden>찍은 날짜를 모르면 <span>받은 날</span>로 표시합니다.</p>
      </div>
      <div class="archive__tools" data-tools></div>
    </div>
    <nav class="monthnav" aria-label="달별로 가기"><ol data-rail></ol></nav>
    <div class="archive__months" data-months><p class="loading">사진을 불러오는 중입니다.</p></div>
  </main>

  <footer class="close" id="longevity" aria-labelledby="longevity-title" data-longevity tabindex="-1"></footer>

  <div class="viewer" id="viewer" hidden></div>
</body>
</html>
