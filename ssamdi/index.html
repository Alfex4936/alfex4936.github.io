<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>쌈디의 날들</title>
  <meta name="description" content="2010년 7월 5일에 태어난 말티즈 쌈디의 사진과 영상을 찍은 날짜 순서대로 모아 둔 곳입니다.">
  <meta name="theme-color" content="#9fd4ff">
  <meta name="color-scheme" content="only light">
  <meta property="og:title" content="쌈디의 날들">
  <meta property="og:description" content="말티즈 쌈디의 사진과 영상을 찍은 날짜 순서대로 모아 둔 곳입니다.">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="alternate icon" href="./favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <script>if ('WebGL2RenderingContext' in window) document.documentElement.classList.add('gl');</script>
  <script type="module" crossorigin src="./assets/main-BfQuP_8v.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/main-BbZCym6z.css">
</head>
<body>
  <canvas class="stage" id="stage" aria-hidden="true"></canvas>
  <a class="skip" href="#archive">사진 모음으로 건너뛰기</a>

  <header class="hero" id="top">
    <div class="sky" aria-hidden="true">
      <div class="cloud" style="--w:220px;--t:95s;--d:-20s;top:9%;--x:8vw"><svg viewBox="0 0 140 70"><path fill="currentColor" d="M22 62a18 18 0 0 1 4-35 26 26 0 0 1 48-10 22 22 0 0 1 38 12 17 17 0 0 1 6 33z"/></svg></div>
      <div class="cloud" style="--w:140px;--t:120s;--d:-75s;top:26%;--x:60vw"><svg viewBox="0 0 140 70"><path fill="currentColor" d="M22 62a18 18 0 0 1 4-35 26 26 0 0 1 48-10 22 22 0 0 1 38 12 17 17 0 0 1 6 33z"/></svg></div>
      <div class="cloud" style="--w:300px;--t:150s;--d:-110s;top:5%;--x:40vw"><svg viewBox="0 0 140 70"><path fill="currentColor" d="M22 62a18 18 0 0 1 4-35 26 26 0 0 1 48-10 22 22 0 0 1 38 12 17 17 0 0 1 6 33z"/></svg></div>
      <div class="cloud" style="--w:110px;--t:80s;--d:-40s;top:48%;--x:82vw"><svg viewBox="0 0 140 70"><path fill="currentColor" d="M22 62a18 18 0 0 1 4-35 26 26 0 0 1 48-10 22 22 0 0 1 38 12 17 17 0 0 1 6 33z"/></svg></div>
      <svg class="hills" viewBox="0 0 1440 190" preserveAspectRatio="none">
        <path fill="#cdeeb5" d="M0 92C180 40 360 34 560 70s380 52 560 12 260-30 320-20V190H0z"/>
      </svg>
    </div>
    <svg class="hills hills--front" viewBox="0 0 1440 190" preserveAspectRatio="none" aria-hidden="true">
      <path fill="#b3e397" d="M0 136c220-58 420-62 640-26s420 44 800-30V190H0z"/>
      <path fill="#fbfdff" d="M0 168c260-30 520-34 760-18s460 20 680-6V190H0z"/>
    </svg>
    <div class="hero__face" role="img" aria-label="쌈디 얼굴 사진">
      <img class="hero__still" src="./hero/ssamdi-800.webp" alt="" width="800" height="681" draggable="false">
    </div>
    <button type="button" class="tilt-tip" data-tilt-tip hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="3.5" width="10" height="17" rx="2.4" transform="rotate(-14 12 12)"/><path d="M3.5 9.5c-1 1.8-1 3.7 0 5.5M20.5 9c1 1.8 1 3.7 0 5.5"/></svg>
      핸드폰을 기울여 보세요!
    </button>
    <div class="hero__text">
      <h1 class="hero__name sticker-text">쌈디</h1>
      <ul class="hero__facts">
        <li class="pill">2010년 7월 5일생</li>
        <li class="pill">말티즈</li>
        <li class="pill">2kg</li>
      </ul>
      <p class="hero__days">
        <span class="hero__label">오늘은 태어난 지</span>
        <strong class="hero__count"><span class="sticker-text" data-days></span><span class="hero__unit">일째</span></strong>
      </p>
      <p class="hero__meta"><span data-age></span><span data-birthday></span></p>
      <p class="hero__line">쌈디가 지나온 날을 찍은 순서대로 모아 둡니다.</p>
      <a class="cta" href="#archive" data-cta><span data-cta-label>사진 모음 보기</span><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v13M6.5 12.5L12 18l5.5-5.5"/></svg></a>
    </div>
  </header>

  <main class="archive" id="archive" aria-labelledby="archive-title">
    <div class="archive__head">
      <h2 class="archive__title sticker-text" id="archive-title">날마다 쌈디</h2>
      <p class="archive__summary" data-summary></p>
      <div class="archive__tools" data-tools></div>
    </div>
    <nav class="monthnav" aria-label="달별로 가기"><ol data-rail></ol></nav>
    <div class="archive__months" data-months><p class="loading">사진을 불러오는 중입니다.</p></div>
  </main>

  <footer class="close" data-longevity></footer>

  <div class="viewer" id="viewer" hidden></div>
</body>
</html>
